[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-analyzer"
version = "0.1.30"
description = "WiFi Analyzer — GTK4/Adwaita app for WiFi network analysis"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Daniel Nylander" }]

[project.urls]
Homepage = "https://github.com/yeager/wifi-analyzer"
Repository = "https://github.com/yeager/wifi-analyzer"
"Bug Tracker" = "https://github.com/yeager/wifi-analyzer/issues"

[project.scripts]
wifi-analyzer = "wifi_analyzer.app:main"

[tool.setuptools.package-data]
wifi_analyzer = ["locale/*/LC_MESSAGES/*.mo"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
