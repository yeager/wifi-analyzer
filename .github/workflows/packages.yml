name: Build distribution packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    name: Capture the demo screenshot
    runs-on: ubuntu-latest
    container: debian:stable
    timeout-minutes: 5
    steps:
      - name: Install GTK screenshot tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates \
            python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus-x11 scrot
      - uses: actions/checkout@v7
      - name: Capture the app with fictional access points
        env:
          GSK_RENDERER: cairo
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          PYTHONPATH: src
          XDG_CONFIG_HOME: ${{ runner.temp }}/wifi-analyzer-demo/config
          XDG_DATA_HOME: ${{ runner.temp }}/wifi-analyzer-demo/data
          WIFI_ANALYZER_DEMO_READY: ${{ runner.temp }}/wifi-analyzer-demo/ready
        run: |
          mkdir -p "$XDG_CONFIG_HOME/wifi-analyzer" "$XDG_DATA_HOME" screenshots
          printf '{"welcome_shown": true}\n' > "$XDG_CONFIG_HOME/wifi-analyzer/welcome.json"
          timeout 30s xvfb-run -a -s '-screen 0 1000x800x24' dbus-run-session -- \
            python3 scripts/capture_demo_screenshot.py screenshots/main.png
      - uses: actions/upload-artifact@v7
        with:
          name: wifi-analyzer-demo-screenshot
          path: screenshots/main.png

  flatpak:
    name: Flatpak build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Flatpak build tools
        run: sudo apt-get update && sudo apt-get install -y flatpak xvfb dbus-x11
      - name: Add Flathub runtime source
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Install Flathub's manifest linter
        run: flatpak install --user --noninteractive flathub org.flatpak.Builder
      - name: Check Flathub manifest lint (advisory)
        continue-on-error: true
        run: >-
          flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder
          --gha-format manifest flatpak/io.github.yeager.WifiAnalyzer.json
      - name: Build GNOME 51 Flatpak
        run: >-
          dbus-run-session -- flatpak run --user --command=flathub-build org.flatpak.Builder
          flatpak/io.github.yeager.WifiAnalyzer.json
      - name: Check built Flatpak repository lint (advisory)
        continue-on-error: true
        run: >-
          flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder
          --gha-format repo repo
      - name: Create installable Flatpak bundle
        run: |
          mkdir -p artifacts/flatpak
          flatpak build-bundle repo \
            artifacts/flatpak/io.github.yeager.WifiAnalyzer.flatpak \
            io.github.yeager.WifiAnalyzer \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Install and smoke-test the Flatpak bundle
        run: |
          flatpak install --user --noninteractive \
            artifacts/flatpak/io.github.yeager.WifiAnalyzer.flatpak
          set +e
          GSK_RENDERER=cairo timeout 8s dbus-run-session -- xvfb-run -a \
            flatpak run --user io.github.yeager.WifiAnalyzer \
            >"$RUNNER_TEMP/wifi-analyzer-flatpak-smoke.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat "$RUNNER_TEMP/wifi-analyzer-flatpak-smoke.log"
            exit "$status"
          fi
          if grep -E 'Traceback|TypeError|ModuleNotFoundError|cairo.Context' \
            "$RUNNER_TEMP/wifi-analyzer-flatpak-smoke.log"; then
            cat "$RUNNER_TEMP/wifi-analyzer-flatpak-smoke.log"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: wifi-analyzer-flatpak
          path: artifacts/flatpak/*.flatpak

  debian:
    name: Debian package
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates \
            devscripts dpkg-dev debhelper dh-python gettext \
            pybuild-plugin-pyproject python3-all python3-setuptools \
            python3-gi python3-gi-cairo python3-cairo python3-pytest \
            gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
      - uses: actions/checkout@v7
      - name: Test GTK behavior and accessibility
        run: GSK_RENDERER=cairo xvfb-run -a pytest -q
      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p artifacts/deb
          cp ../*.deb ../*.buildinfo ../*.changes artifacts/deb/
      - name: Smoke-test the built Debian package
        run: |
          set -eu
          package=$(find .. -maxdepth 1 -type f -name 'wifi-analyzer_*_all.deb' -print -quit)
          test -n "$package"
          dpkg-deb --field "$package" Depends | grep -Fq 'python3-gi-cairo'
          staging="$RUNNER_TEMP/wifi-analyzer-deb"
          log="$RUNNER_TEMP/wifi-analyzer-deb-smoke.log"
          dpkg-deb --extract "$package" "$staging"
          set +e
          GSK_RENDERER=cairo \
            PYTHONPATH="$staging/usr/lib/python3/dist-packages" \
            timeout 8s xvfb-run -a dbus-run-session -- \
            "$staging/usr/bin/wifi-analyzer" >"$log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat "$log"
            exit "$status"
          fi
          if grep -E 'Traceback|TypeError|ModuleNotFoundError|cairo.Context' "$log"; then
            cat "$log"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: wifi-analyzer-deb
          path: artifacts/deb/

  rpm:
    name: RPM package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools
        run: |
          dnf -y install git rpm-build rpmdevtools rpm-devel \
            python3-devel python3-setuptools python3-pytest \
            python3-gobject python3-cairo gettext desktop-file-utils appstream \
            gtk4 libadwaita xorg-x11-server-Xvfb
      - uses: actions/checkout@v7
      - name: Prepare RPM source archive
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          mkdir -p "$HOME/rpmbuild/SOURCES"
          git archive --format=tar.gz --prefix="wifi-analyzer-$version/" HEAD \
            > "$HOME/rpmbuild/SOURCES/wifi-analyzer-$version.tar.gz"
      - name: Build RPM package
        run: rpmbuild -ba packaging/rpm/wifi-analyzer.spec
      - uses: actions/upload-artifact@v7
        with:
          name: wifi-analyzer-rpm
          path: ~/rpmbuild/RPMS/**/*.rpm
